[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rotordyn"
version = "0.1.0"
description = "Rotor dynamics lateral vibration calculator (Myklestad-Prohl transfer matrix method)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "nicegui>=2.0",
    "plotly>=5.0",
    "openpyxl>=3.1",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rotordyn = "rotordyn.__main__:main"
rotordyn-gui = "main:main"
