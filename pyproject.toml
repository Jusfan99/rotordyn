[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rotordyn"
version = "0.1.0"
description = "Rotor dynamics lateral vibration calculator (Myklestad-Prohl transfer matrix method)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rotordyn = "rotordyn.__main__:main"
